          var safe = esc(errMsg);
          var timeHtml = '';
          try {

          } catch(e) {}

              '<h1 style="font-size:26px;font-weight:700;margin:0 0 10px 0;">' + esc(title || '系统崩溃') + '</h1>' +
              '<p style="font-size:14px;margin:0 0 6px 0;opacity:0.85;">' + esc(sub || '核心代码运行时出错') + '</p>' +
              timeHtml +
              '<p style="font-size:13px;margin:0 0 28px 0;opacity:0.7;word-break:break-all;">' + safe + '</p>' +
              '<button onclick="try{sessionStorage.clear();sessionStorage.setItem(\'lingjie-restart-lock\',\'1\');sessionStorage.setItem(\'lingjie-restart-anim\',\'1\');}catch(e){};location.reload();" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:15px;padding:12px 32px;cursor:pointer;">重启灵界 OS</button>' +
            '</div>';

        // 页面加载时检查标记（来自上一轮错误或彩蛋）
        try {
          var saved = sessionStorage.getItem('lingjie-bsod');
          var easterEgg = sessionStorage.getItem('lingjie-bsod-easter-egg');
          if (saved) {
            showBsod(saved, '系统崩溃', '核心代码运行时出错');
            return;
          }
          if (easterEgg) {
            showBsod(easterEgg, '蓝屏彩蛋', '这是终端触发的彩蛋蓝屏');
            return;
          }
        } catch(e) {}

        // 启动超时检测：核心模块 15 秒未就绪则蓝屏
        var startTime = Date.now();
        var timer = setInterval(function() {
          if (window.__LINGJIE_READY) { clearInterval(timer); return; }
          if (sessionStorage.getItem('lingjie-bsod')) { clearInterval(timer); return; }
          try {
            if (Date.now() - startTime > 15000 && !sessionStorage.getItem('lingjie-bsod')) {
              sessionStorage.setItem('lingjie-bsod', '系统启动超时（核心模块 15 秒未响应）');
              sessionStorage.setItem('lingjie-bsod-time', Date.now());
              location.reload();
            }
          } catch(e) {}
        }, 500);

        // 捕获所有同步运行时错误
        window.addEventListener('error', function(ev) {
          if (_locked) return;
          var url = ev.filename || ev.target && ev.target.src || '';
          // 忽略外部资源错误
          if (url && url.indexOf(location.hostname) === -1 && url.indexOf(location.origin) === -1) {
            ev.preventDefault();
            return;
          }
          _locked = true;
          var msg = (ev.message || ev.error && ev.error.message || 'Unknown error') + ' at ' + (ev.filename || '') + ':' + (ev.lineno || '') + ':' + (ev.colno || '');
          try {
            sessionStorage.setItem('lingjie-bsod', msg);
            sessionStorage.setItem('lingjie-bsod-time', Date.now());
          } catch(e) {}
          ev.preventDefault();
          location.reload();
        });

        // 捕获所有未处理的 Promise rejection
        window.addEventListener('unhandledrejection', function(ev) {
          if (_locked) return;
          _locked = true;
          var reason = ev.reason;
          var msg = 'Unhandled Promise rejection: ';
          if (reason && reason.stack) msg += reason.stack.split('\n')[0];
          else if (reason && reason.message) msg += reason.message;
          else msg += String(reason);
          try {
            sessionStorage.setItem('lingjie-bsod', msg);
            sessionStorage.setItem('lingjie-bsod-time', Date.now());
          } catch(e) {}
          location.reload();
        });

      })();

    <script>
      // === 弹性回弹：边界拉伸 + 惯性冲撞回弹 ===
      (function() {
        'use strict';
        if (!('ontouchstart' in window)) return;

        var st = null;       // 触摸状态
        var monitorId = null; // 惯性监控 rAF id

        // 安全取消 rAF：24Hz 模式下 rAF 返回 Symbol，切回默认后原生 CAF 不接受 Symbol
        function safeCancelRAF(id) {
          if (id == null) return;
          try { cancelAnimationFrame(id); } catch(e) {}
        }

        function findScroll(node) {
          var el = node;
          while (el && el !== document.body) {
            var oy = window.getComputedStyle(el).overflowY;
            if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 2) return el;
            el = el.parentElement;
          }
          return null;
        }

        // 对滚动容器的所有子元素设置 transform
        function setChildrenTransform(el, px, transition) {
          var kids = el.children;
          for (var i = 0; i < kids.length; i++) {
            kids[i].style.transition = transition || 'none';
            kids[i].style.transform = px === 0 ? '' : 'translateY(' + px + 'px)';
          }
        }

        // 应用一次性弹跳：内容冲过边界，然后用带 overshoot 的 bezier 弹回
        function applyBounce(el, px) {
          // 1. 瞬间移动到"冲过头"的位置
          setChildrenTransform(el, px, 'none');
          void el.offsetHeight; // 强制 reflow
          // 2. 带 overshoot 弹回 0
          setChildrenTransform(el, 0, 'transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)');
        }

        // === touchstart：记录滚动容器 ===
        document.addEventListener('touchstart', function(e) {
          if (monitorId) { safeCancelRAF(monitorId); monitorId = null; }
          var el = findScroll(e.target);
          if (!el) { st = null; return; }
          st = { el: el, lastY: e.touches[0].clientY, offset: 0 };
          setChildrenTransform(el, 0, 'none');
        }, { passive: true });

        // === touchmove：手指拖到边界时拉伸 ===
        document.addEventListener('touchmove', function(e) {
          if (!st) return;
          var y = e.touches[0].clientY;
          var dy = y - st.lastY;
          st.lastY = y;
          var el = st.el;
          var max = el.scrollHeight - el.clientHeight;

          if (el.scrollTop <= 0 && dy > 0) {
            st.offset += dy * 0.4;
            st.offset = Math.min(st.offset, 70);
            setChildrenTransform(el, st.offset, 'none');
          } else if (el.scrollTop >= max && dy < 0) {
            st.offset += dy * 0.4;
            st.offset = Math.max(st.offset, -70);
            setChildrenTransform(el, st.offset, 'none');
          } else if (st.offset !== 0) {
            st.offset = 0;
            setChildrenTransform(el, 0, 'none');
          }
        }, { passive: true });

        // === touchend：释放拉伸 + 监控惯性冲撞 ===
        document.addEventListener('touchend', function() {
          if (!st) return;
          var el = st.el;

          // 释放拉伸
          if (st.offset !== 0) {
            setChildrenTransform(el, 0, 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)');
          }
          st = null;

          // 监控原生惯性：检测冲到边界
          var prevST = el.scrollTop;
          var prevT = Date.now();
          var max = el.scrollHeight - el.clientHeight;
          var deadline = Date.now() + 2000;

          function monitor() {
            if (Date.now() > deadline) { monitorId = null; return; }
            var now = Date.now();
            var curST = el.scrollTop;
            var dt = now - prevT;

            if (dt > 0) {
              var vel = (curST - prevST) / dt * 16;

              // 冲到顶部（向上滚，vel 为负）
              if (curST <= 0 && vel < -1.5) {
                applyBounce(el, Math.min(Math.abs(vel) * 4, 50));
                monitorId = null;
                return;
              }
              // 冲到底部（向下滚，vel 为正）
              if (curST >= max && vel > 1.5) {
                applyBounce(el, -Math.min(vel * 4, 50));
                monitorId = null;
                return;
              }
              // 速度归零 → 停止监控
              if (Math.abs(curST - prevST) < 0.5) {
                monitorId = null;
                return;
              }
            }

            prevST = curST;
            prevT = now;
            monitorId = requestAnimationFrame(monitor);
          }
          monitorId = requestAnimationFrame(monitor);
        }, { passive: true });

        document.addEventListener('touchcancel', function() {
          if (monitorId) { safeCancelRAF(monitorId); monitorId = null; }
          if (st && st.offset !== 0) {
            setChildrenTransform(st.el, 0, 'transform 0.3s');
          }
          st = null;
        }, { passive: true });
      })();
    </script>
